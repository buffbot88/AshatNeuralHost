name: Release (AHN v1)

# Cut a release:  git tag v1.0.0 && git push origin v1.0.0
# The workflow tests, packages (code only — models are downloaded by users),
# and attaches dist/* to the GitHub Release.

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="dist/stage"
          mkdir -p "$STAGE"
          cp -r host config.toml package.json README.md LICENSE ashat ashat.cmd "$STAGE/"
          mkdir -p "$STAGE/models"
          cp models/README.md "$STAGE/models/"
          test ! -f "$STAGE/models/"*.gguf  # never ship weights
          cd dist
          TAG="$TAG" python3 -c "import os, shutil; t = os.environ['TAG']; shutil.make_archive(f'ashat-neural-host-{t}', 'gztar', root_dir='stage', base_dir='.'); shutil.make_archive(f'ashat-neural-host-{t}', 'zip', root_dir='stage', base_dir='.')"
          ls -la

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip \
            --title "Ashat Neural Host ${GITHUB_REF_NAME}" \
            --notes "AHN ${GITHUB_REF_NAME}: drop a .gguf in models/, npm start, open the site. See README for per-OS setup."
